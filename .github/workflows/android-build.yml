name: Build DuolingoChessBot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Native Stockfish (arm64-v8a) via Android NDK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          git clone --depth 1 --branch sf_11 https://github.com/official-stockfish/Stockfish.git /tmp/sf
          cd /tmp/sf/src
          NDK_CLANG=$(find $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin -name "aarch64-linux-android24-clang++" | head -n 1)
          echo "Using NDK Compiler: $NDK_CLANG"
          "$NDK_CLANG" -O3 -std=c++17 -DNDEBUG -DIS_64BIT -DUSE_POPCNT -static -pthread \
            -Wl,-z,max-page-size=16384 \
            *.cpp syzygy/tbprobe.cpp \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - name: Setup Gradle & Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuolingoChessBot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DuolingoChessBot v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
