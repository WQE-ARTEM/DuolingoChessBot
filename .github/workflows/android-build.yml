name: Build DuolingoChessBot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean Termux overrides and Build Debug APK
        run: |
          sed -i '/aapt2/d' gradle.properties 2>/dev/null || true
          rm -f local.properties app/gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache -Pandroid.aapt2FromMavenOverride=""

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuolingoChessBot-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
