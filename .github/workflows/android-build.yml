name: Build DuolingoChessBot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuolingoChessBot-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Latest Release APK
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "DuolingoChessBot Latest APK" \
            --notes "Автоматическая сборка интерактивной доски бота"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
